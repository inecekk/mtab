version: '3'
services:
  mtab:
    image: weiruchenai1/mtab:latest
    container_name: mtab-unlimited
    ports:
      - "9200:80"
    volumes:
      - ./:/app
    environment:
      MYSQL_HOST: 172.17.0.1
      MYSQL_USER: root
      MYSQL_PORT: 3306
      MYSQL_PASSWORD: 123456
      MYSQL_DATABASE: mtab
      ADMIN_USER: admin
      ADMIN_PASSWORD: admin123
    restart: always
